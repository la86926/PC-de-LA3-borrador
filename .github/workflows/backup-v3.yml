name: Backup v3 verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.backup-v3-trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch and static-check backup v3
        shell: bash
        run: |
          set +e
          if [ -f .backup-v3-hotfix.py ]; then python3 .backup-v3-hotfix.py > backup-v3-run.log 2>&1; fi
          python3 .backup-v3-run.py >> backup-v3-run.log 2>&1
          code=$?
          echo "patch_exit_code=$code" >> backup-v3-run.log
          cat backup-v3-run.log
          echo "$code" > /tmp/backup-v3-patch-exit
          exit 0
      - name: Install Chromium test tools
        if: always()
        shell: bash
        run: |
          if [ "$(cat /tmp/backup-v3-patch-exit)" != "0" ]; then exit 0; fi
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Reproduce reported backup scenario
        if: always()
        shell: bash
        run: |
          if [ "$(cat /tmp/backup-v3-patch-exit)" != "0" ]; then echo "browser skipped: patch failed" > backup-v3-browser.log; echo 1 > /tmp/backup-v3-browser-exit; exit 0; fi
          python3 -m http.server 8000 >/tmp/pc-http.log 2>&1 &
          server=$!
          sleep 2
          set +e
          node .backup-v3-browser.js > backup-v3-browser.log 2>&1
          code=$?
          echo "browser_exit_code=$code" >> backup-v3-browser.log
          kill "$server" 2>/dev/null || true
          cat backup-v3-browser.log
          echo "$code" > /tmp/backup-v3-browser-exit
          exit 0
      - name: Commit verification outputs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in index1.html index2.html backup-v3-validation.txt backup-v3-run.log backup-v3-browser.log; do
            [ -e "$f" ] && git add "$f"
          done
          git diff --cached --quiet || git commit -m "Verify staged backup restore v3"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          p=$(cat /tmp/backup-v3-patch-exit)
          b=$(cat /tmp/backup-v3-browser-exit 2>/dev/null || echo 1)
          if [ "$p" != "0" ] || [ "$b" != "0" ]; then exit 1; fi
