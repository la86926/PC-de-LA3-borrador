name: Backup v3 verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.backup-v3-trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  verify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Run backup v3 audit or patch
        shell: bash
        run: |
          python3 .backup-v3-run.py > backup-v3-run.log 2>&1
          cat backup-v3-run.log
      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index1.html index2.html backup-v3-report.txt backup-v3-validation.txt backup-v3-run.log 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Run backup v3 verification"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
