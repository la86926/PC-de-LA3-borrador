name: Assistant patch mobile chess controls
on:
  push:
    paths:
      - '.github/workflows/_assistant_inspect.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch mobile controls
        shell: python
        run: |
          from pathlib import Path

          mobile_script = r'''<script id="pc-mobile-nav-v1">
          (function(){
            var mq=window.matchMedia('(max-width: 700px)');
            function aplicarNavegacionMovil(){
              var anterior=document.getElementById('b-prev-top');
              var siguiente=document.getElementById('b-next-top');
              var filaSuperior=anterior&&anterior.parentElement;
              var reiniciar=document.getElementById('b-reset');
              var filaInferior=reiniciar&&reiniciar.parentElement;
              if(!anterior||!siguiente||!filaInferior)return;

              if(anterior.dataset.pcEstiloOriginal===undefined) anterior.dataset.pcEstiloOriginal=anterior.getAttribute('style')||'';
              if(siguiente.dataset.pcEstiloOriginal===undefined) siguiente.dataset.pcEstiloOriginal=siguiente.getAttribute('style')||'';

              if(mq.matches){
                var fila=document.getElementById('pc-mobile-exercise-nav');
                if(!fila){
                  fila=document.createElement('div');
                  fila.id='pc-mobile-exercise-nav';
                  fila.style.cssText='display:flex;align-items:center;justify-content:flex-end;gap:.55rem;width:100%;max-width:620px;margin:.7rem auto 0;';
                  filaInferior.parentNode.insertBefore(fila,filaInferior);
                }
                if(anterior.parentNode!==fila) fila.appendChild(anterior);
                if(siguiente.parentNode!==fila) fila.appendChild(siguiente);
                if(filaSuperior&&filaSuperior!==fila) filaSuperior.style.display='none';

                [anterior,siguiente].forEach(function(b){
                  b.style.display='flex';
                  b.style.alignItems='center';
                  b.style.justifyContent='center';
                  b.style.flex='0 0 98px';
                  b.style.width='98px';
                  b.style.minWidth='98px';
                  b.style.height='48px';
                  b.style.minHeight='48px';
                  b.style.padding='0 .85rem';
                  b.style.fontSize='1rem';
                  b.style.fontWeight='650';
                  b.style.lineHeight='1';
                  b.style.touchAction='manipulation';
                });
              }else{
                var fila=document.getElementById('pc-mobile-exercise-nav');
                var destino=document.querySelector('.boardhead-right');
                if(destino){
                  destino.appendChild(anterior);
                  destino.appendChild(siguiente);
                  destino.style.display='';
                }
                anterior.setAttribute('style',anterior.dataset.pcEstiloOriginal||'');
                siguiente.setAttribute('style',siguiente.dataset.pcEstiloOriginal||'');
                if(fila)fila.remove();
              }
            }
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',aplicarNavegacionMovil,{once:true});
            else aplicarNavegacionMovil();
            if(mq.addEventListener)mq.addEventListener('change',aplicarNavegacionMovil);
            else if(mq.addListener)mq.addListener(aplicarNavegacionMovil);
          })();
          </script>'''

          for fn in ('index1.html','index2.html'):
              p=Path(fn)
              s=p.read_text(encoding='utf-8')
              if 'b-prev-top' not in s or 'b-next-top' not in s or 'b-reset' not in s:
                  raise SystemExit(f'No se encontraron los controles esperados en {fn}')
              s=s.replace('Droidfish','Stockfish')
              if 'pc-mobile-nav-v1' not in s:
                  if '</body>' not in s:
                      raise SystemExit(f'No se encontró </body> en {fn}')
                  s=s.replace('</body>', mobile_script+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')

              check=p.read_text(encoding='utf-8')
              assert 'Stockfish' in check
              assert 'pc-mobile-exercise-nav' in check
              assert "98px" in check and "48px" in check

      - name: Commit changes
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index1.html index2.html
          git commit -m "Improve mobile navigation controls" || exit 0
          git push
