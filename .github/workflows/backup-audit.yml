name: Backup feature verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.backup-audit-trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-and-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch both index files and run verification
        shell: bash
        run: python3 .backup-feature-patch.py
      - name: Commit verified feature to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index1.html index2.html backup-feature-validation.txt
          git diff --cached --quiet || git commit -m "Add complete backup import and export"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
