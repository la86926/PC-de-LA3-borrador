name: Backup browser integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.backup-audit-trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  browser-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Install browser test tools
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --silent playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run cross-index backup integration test
        shell: bash
        run: |
          python3 -m http.server 8000 >/tmp/pc-http.log 2>&1 &
          server=$!
          sleep 2
          set +e
          node .backup-browser-test.js > backup-browser-test.log 2>&1
          code=$?
          echo "exit_code=$code" >> backup-browser-test.log
          kill "$server" 2>/dev/null || true
          cat backup-browser-test.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup-browser-test.log
          git diff --cached --quiet || git commit -m "Record browser backup integration test"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          exit "$code"
