name: Backup feature verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.backup-audit-trigger'

permissions:
  contents: write
  pull-requests: read

jobs:
  verify-and-patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch both index files and capture verification
        shell: bash
        run: |
          set +e
          python3 .backup-feature-patch.py > backup-feature-run.log 2>&1
          code=$?
          echo "exit_code=$code" >> backup-feature-run.log
          if [ "$code" -ne 0 ]; then
            git checkout -- index1.html index2.html
            rm -f backup-feature-validation.txt
          fi
          cat backup-feature-run.log
          exit 0
      - name: Commit patch or diagnostic to PR branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backup-feature-run.log
          if [ -f backup-feature-validation.txt ]; then
            git add index1.html index2.html backup-feature-validation.txt
          fi
          git diff --cached --quiet || git commit -m "Verify backup import and export"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
