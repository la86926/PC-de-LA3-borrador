plugins {
    id 'com.android.application'
}

android {
    namespace 'com.luis.pajaritoc'
    compileSdk 35

    defaultConfig {
        applicationId 'com.luis.pajaritoc'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
}
